<!DOCTYPE html><html><head><title>定向入库</title></head><body>
<div id="ScopedImportPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
<div data-role="content"><div class="content-primary"><h1>定向入库</h1>
<p>输入新增电影或剧集目录。自动匹配媒体库，只追加缺失条目；已有条目跳过。</p>
<p>0.2 版：支持普通视频、独立电影目录、S01E01、E01 单集目录或带季集编号 NFO 的电视剧。暂不支持 ISO、光盘、快捷方式、多版本电影。已有库必须完成初始化。</p>
<form id="siForm"><div class="inputContainer"><label class="inputLabel" for="siPath">新增影视的完整路径</label><input is="emby-input" id="siPath" required placeholder="E:\Media\TV\ExampleShow" /></div>
<div class="inputContainer"><label for="siMetadata">新条目的元数据</label><select id="siMetadata" style="display:block;position:static;opacity:1;pointer-events:auto;padding:10px;width:100%;color:inherit;background:#202b35"><option value="library">按 Jellyfin 媒体库设置获取（推荐）</option><option value="local">只读取本地 NFO，不联网刮削</option></select><p>遵循该媒体库启用的远程元数据提供器及优先级；已有条目仍跳过。</p></div>
<p><button is="emby-button" type="submit" id="siSubmit" class="raised button-submit block"><span>定向入库</span></button></p></form>
<pre id="siResult" style="white-space:pre-wrap;overflow-wrap:anywhere" aria-live="polite">正在检查插件保护状态……</pre>
<script>
(function(){const page=document.querySelector('#ScopedImportPage');let timer=null,busy=false;
const output=page.querySelector('#siResult'),button=page.querySelector('#siSubmit');
const api=(path,method,body)=>ApiClient.ajax({type:method||'GET',url:ApiClient.getUrl('ScopedImport/'+path),dataType:'json',contentType:'application/json',data:body?JSON.stringify(body):undefined});
page.addEventListener('viewshow',()=>{if(busy)return;api('Libraries').then(r=>{button.disabled=!r.Ready;output.textContent=r.Ready?'已就绪。粘贴新增目录后提交。':'当前服务未启用只追加保护，无法入库。';}).catch(e=>{button.disabled=true;output.textContent='无法连接插件或没有管理员权限';});});
page.querySelector('#siForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;button.disabled=true;
try{const r=await api('Import','POST',{Path:page.querySelector('#siPath').value.trim(),FetchMetadata:page.querySelector('#siMetadata').value==='library'});
output.textContent='请求已提交，操作编号：'+r.OperationId;
const poll=async()=>{try{const s=await api('Operations/'+r.OperationId);output.textContent=s.Message+'\n\n新增 '+s.Created.length+' 项；跳过 '+s.Skipped.length+' 项\n'+s.Created.map(x=>x.Type+'：'+x.Name).join('\n')+'\n\n'+s.Warnings.join('\n')+'\n'+(s.MetadataProviders||[]).map(x=>x.Type+' / '+x.Provider+'：'+x.Outcome).join('\n');
if(['Completed','Rejected','Partial'].includes(s.State)){busy=false;button.disabled=false;}else timer=setTimeout(poll,2000);
}catch(err){output.textContent+='\n查询失败，状态尚未确认；不要重复提交。操作编号：'+r.OperationId;busy=false;button.disabled=false;}};poll();
}catch(err){output.textContent='提交未确认，请检查连接和权限；不要自动重复提交。';busy=false;button.disabled=false;}});
})();
</script></div></div></div></body></html>
