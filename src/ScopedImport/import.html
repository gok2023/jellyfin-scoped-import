<!DOCTYPE html><html><head><title>定向入库</title></head><body>
<div id="ScopedImportPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
<div data-role="content"><div class="content-primary"><h1>定向入库</h1>
<p>输入新增电影或剧集目录。自动匹配媒体库，只追加缺失条目；已有条目跳过。</p>
<p>0.2.0.1：支持普通视频、独立电影目录、S01E01、E01 单集目录或带季集编号 NFO 的电视剧。暂不支持 ISO、光盘、快捷方式、多版本电影。已有库必须完成初始化。</p>
<form id="siForm"><div class="inputContainer"><label class="inputLabel" for="siPath">新增影视的完整路径</label><input is="emby-input" id="siPath" required placeholder="E:\Media\TV\ExampleShow" /></div>
<div class="inputContainer"><label for="siMetadata">新条目的元数据</label><select id="siMetadata" style="display:block;position:static;opacity:1;pointer-events:auto;padding:10px;width:100%;color:inherit;background:#202b35"><option value="library">按 Jellyfin 媒体库设置获取（推荐）</option><option value="local">只读取本地 NFO，不联网刮削</option></select><p>遵循该媒体库启用的远程元数据提供器及优先级；已有条目仍跳过。</p></div>
<p><button is="emby-button" type="submit" id="siSubmit" disabled class="raised button-submit block"><span>定向入库</span></button></p></form>
<button type="button" id="siResume" hidden>重新查询上次操作</button><button type="button" id="siForget" hidden>结束旧编号跟踪并检查就绪状态</button><div id="siMovies"></div>
<pre id="siResult" style="white-space:pre-wrap;overflow-wrap:anywhere" aria-live="polite">正在检查插件保护状态……</pre>
<script>

(function(){const page=document.querySelector('#ScopedImportPage');let timer=null,polling=false,operation=null,busy=false;
const output=page.querySelector('#siResult'),submitButton=page.querySelector('#siSubmit'),resumeButton=page.querySelector('#siResume'),forgetButton=page.querySelector('#siForget');
const serverBase=new URL(ApiClient.serverAddress().replace(/\/$/,'')+'/');serverBase.search='';serverBase.hash='';
const serverIdentity=()=>ApiClient.serverId();
function onAuthError(error){if(['Unauthorized','Forbidden'].includes(error.kind))ready=false;}
function renderAccess(){}
async function api(route,method='GET',body){
 try{const data=await ApiClient.ajax({type:method,url:ApiClient.getUrl(route),dataType:'json',contentType:'application/json',data:body?JSON.stringify(body):undefined});if(!data||typeof data!=='object')throw failure('InvalidResponse');return data;}
 catch(error){if(error?.kind)throw error;if(error?.name==='SyntaxError')throw failure('InvalidResponse');
  let data;try{data=error?.responseJSON??(typeof error?.json==='function'?await error.json():JSON.parse(error?.responseText));}catch{}
  throw httpFailure(Number(error?.status)||0,data,route);
 }
}

const metadataLabels={LocalOnly:'仅本地处理，未调用远程提供器',FetchedFields:'已获取部分元数据；未执行完整刮削、远程图片或演员流程',NoMatch:'无匹配，等待手动识别',ProvidersUnavailable:'未启用或没有可用远程提供器，等待手动识别',ProviderFailed:'提供器失败，等待手动识别',ProviderTimeout:'提供器超时，等待手动识别',ExistingSkipped:'已有条目已跳过，元数据未经本次检查；不完整时请手动识别'};
const providerLabels={Metadata:'返回元数据',NoMetadata:'无匹配',Error:'失败',Timeout:'超时'};
function renderMovies(movies){
 const container=page.querySelector('#siMovies');container.replaceChildren();
 for(const movie of movies||[]){
  const row=document.createElement('p'),text=document.createElement('span');
  text.textContent=movie.Name+'：'+(movie.EntryState==='Created'?'条目已创建；':'')+(metadataLabels[movie.MetadataStatus]||movie.MetadataStatus)+'。ItemId：'+movie.ItemId+'。';row.appendChild(text);
  if(/^(?:[a-f0-9]{32}|[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12})$/i.test(movie.ItemId)&&ApiClient.serverId()){
   const link=document.createElement('a');const url=new URL('web/index.html',ApiClient.serverAddress().replace(/\/$/,'')+'/');
   url.hash='/details?id='+encodeURIComponent(movie.ItemId.replace(/-/g,''))+'&serverId='+encodeURIComponent(ApiClient.serverId());
   link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='打开该电影详情';row.appendChild(link);
  }
  const help=document.createElement('span');help.textContent=' '+movie.ManualIdentification+' 此链接只打开详情页；若需登录，请使用 Jellyfin Web 管理员账户，返回此处可再次打开。';row.appendChild(help);container.appendChild(row);
 }
}


function failure(kind,status=0){return Object.assign(Error(errorText({kind,status})),{kind,status});}
function httpFailure(status,body,route){
 const prefix='ScopedImport/Operations/',id=route.startsWith(prefix)?decodeURIComponent(route.slice(prefix.length)):null;
 const sameId=(a,b)=>typeof a==='string'&&typeof b==='string'&&a.replace(/-/g,'').toLowerCase()===b.replace(/-/g,'').toLowerCase();
 const confirmed=status===404&&id&&body&&body.Code==='ScopedImport.OperationNotFound'&&sameId(body.OperationId,id);
 return failure(confirmed?'OperationNotFound':status===401?'Unauthorized':status===403?'Forbidden':status===404?'EndpointNotFound':status>=500?'ServiceError':status===0?'Network':'HttpError',status);
}
function errorText(error){
 switch(error.kind){
 case 'OperationNotFound':return '记录已失效，原操作结果无法从该记录确认。服务可能已重启或记录已淘汰；这不代表原任务失败或没有写入。可显式结束跟踪后检查就绪状态，再决定是否提交新任务。';
 case 'Unauthorized':return 'HTTP 401：登录已失效或未认证，请重新登录管理员账户后查询；旧编号继续保留。';
 case 'Forbidden':return 'HTTP 403：当前账户没有管理员权限，请使用管理员账户重新登录后查询；旧编号继续保留。';
 case 'EndpointNotFound':return 'HTTP 404：未收到插件对该编号的不存在确认；请检查插件加载、服务器地址和基础路径。原操作结果未知，不能据此结束跟踪。';
 case 'ServiceError':return '服务故障 HTTP '+error.status+'，原操作结果尚未确认；请恢复服务后重新查询。';
 case 'InvalidResponse':return '服务器返回格式异常，未收到有效 JSON；原操作结果尚未确认。';
 case 'Network':return '网络连接失败或请求超时，状态尚未确认；请恢复连接后重新查询，不要重复提交。';
 default:return '服务器返回 HTTP '+error.status+'，状态尚未确认；请检查服务后重新查询。';
 }
}
let trackingKey=null,trackingLoaded=false,legacy=false,missing=false,ready=false,checking=false;
function loadTracking(){
 trackingKey='scoped-operation:v2:'+encodeURIComponent(serverBase.href)+':'+encodeURIComponent(serverIdentity().toLowerCase());
 operation=sessionStorage.getItem(trackingKey);legacy=false;
 if(!operation){operation=sessionStorage.getItem('scoped-operation');legacy=!!operation;}
 missing=false;busy=!!operation;trackingLoaded=true;
}
function saveTracking(){sessionStorage.setItem(trackingKey,operation);}
function removeTracking(){
 const key=legacy?'scoped-operation':trackingKey;
 if(key&&sessionStorage.getItem(key)===operation)sessionStorage.removeItem(key);
}
function legacyNotice(){output.textContent='发现旧版未绑定服务器的操作编号：'+operation+'。无法确认其归属，尚未向当前服务器查询。确认归属后可点击查询，或显式结束旧编号跟踪；结束跟踪不取消服务端任务，也不代表任务失败或没有写入。';}
function controls(){
 submitButton.disabled=!ready||busy;
 resumeButton.hidden=!operation&&ready;
 resumeButton.disabled=polling||checking;
 resumeButton.textContent=legacy?'确认归属并在此服务器查询旧编号':operation?'重新查询上次操作':'重新检查连接与就绪状态';
 forgetButton.hidden=!operation||(!missing&&!legacy);
 forgetButton.disabled=polling||checking;
}
async function checkReady(prefix=''){
 if(checking)return false;checking=true;ready=false;controls();
 try{const health=await api('ScopedImport/Libraries');
  if(health.Ready!==true){output.textContent=prefix+'追加保护未启用；仅支持 Jellyfin 10.11.11 原版存储服务。新任务入口保持关闭。';return false;}
  ready=true;return true;
 }catch(error){onAuthError(error);output.textContent=prefix+'就绪检查失败：'+errorText(error);return false;}
 finally{checking=false;controls();}
}
async function initialize(){
 if(polling||checking||(busy&&!operation))return false;
 if(!await checkReady())return false;
 if(!trackingLoaded)loadTracking();
 if(legacy)legacyNotice();else if(operation)await poll();else output.textContent='已就绪。粘贴新增目录后提交。';
 controls();return true;
}
async function poll(){
 if(!operation||polling||legacy||!ready)return;
 const queried=operation;polling=true;missing=false;clearTimeout(timer);controls();
 try{const s=await api('ScopedImport/Operations/'+encodeURIComponent(queried));if(operation!==queried)return;
  output.textContent=s.Message+'\n操作编号：'+queried+'\n新增 '+s.Created.length+' 项；跳过 '+s.Skipped.length+' 项\n'+s.Created.map(x=>x.Type+'：'+x.Name).join('\n')+'\n'+s.Warnings.join('\n')+'\n'+(s.MetadataProviders||[]).map(x=>x.Type+' / '+x.Provider+'：'+(providerLabels[x.Outcome]||x.Outcome)).join('\n');
  renderMovies(s.Movies);renderAccess(s);
  if(['Completed','Rejected','Partial'].includes(s.State)){removeTracking();busy=false;operation=null;}else{busy=true;timer=setTimeout(poll,2000);}
 }catch(error){if(operation!==queried)return;missing=error.kind==='OperationNotFound';busy=true;
  if(missing)renderMovies([]);onAuthError(error);output.textContent=errorText(error)+'\n操作编号：'+queried;
 }finally{polling=false;controls();}
}
resumeButton.addEventListener('click',async()=>{
 if(polling||checking)return;
 if(!ready&&!await checkReady())return;
 if(!trackingLoaded)loadTracking();
 if(legacy){removeTracking();legacy=false;saveTracking();}
 if(operation)await poll();else{output.textContent='已就绪。粘贴新增目录后提交。';controls();}
});
forgetButton.addEventListener('click',async()=>{
 if(polling||checking||!operation||(!missing&&!legacy))return;
 const ended=operation;clearTimeout(timer);removeTracking();operation=null;busy=false;legacy=false;missing=false;ready=false;renderMovies([]);
 const notice='已结束对旧编号 '+ended+' 的跟踪；原操作结果仍无法由此确认。这不会取消服务端任务，也不表示没有写入。\n';
 output.textContent=notice+'正在重新检查就绪状态……';controls();
 if(await checkReady(notice))output.textContent=notice+'已通过就绪检查，可选择模式后显式提交新任务；服务端任务锁及已有项检查仍会执行。';
});

page.addEventListener('viewshow',initialize);
page.querySelector('#siForm').addEventListener('submit',async e=>{
 e.preventDefault();if(busy||!ready)return;busy=true;controls();renderMovies([]);output.textContent='正在提交……';
 try{const r=await api('ScopedImport/Import','POST',{Path:page.querySelector('#siPath').value.trim(),FetchMetadata:page.querySelector('#siMetadata').value==='library'});
  operation=r.OperationId;saveTracking();output.textContent='请求已提交，操作编号：'+operation;poll();
 }catch(error){onAuthError(error);output.textContent='提交未确认：'+errorText(error)+' 不会自动重试；请先确认服务端。';busy=false;controls();}
});
controls();})();
</script></div></div></div></body></html>
